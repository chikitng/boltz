[workspace]
channels = ["conda-forge"]
name = "boltz_2"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
numpy = ">=1.26,<2.0"
rdkit = ">=2026.3.6,<2027"
libstdcxx = ">=16.2.0,<17"

[pypi-dependencies]
boltz = { version = ">=2.2.1, <3", extras = ["cuda"] }
torch = "==2.10.0+cu128"

[pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-first-match"

[activation.env]
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib"